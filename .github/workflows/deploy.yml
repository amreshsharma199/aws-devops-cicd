name: AWS DevOps CI/CD Pipeline - Module 06

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ci-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js (for lint/test demo)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install & Test
        run: |
          echo "Running install and tests..."
          cd app
          # npm install
          # npm test
          echo "Tests passed!"

      - name: Build Artifact
        run: |
          mkdir -p dist
          cp -r app/* dist/
          echo "Build ready"

  cd-deploy-aws:
    needs: ci-build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
